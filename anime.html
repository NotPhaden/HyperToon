                <small>COLECȚIE</small>

                <h2>
                    Naruto

            <div class="collection-card-body">

    <div
        id="collectionEmpty"
        class="collection-empty"
    >
        Nu am găsit nimic pentru căutarea ta.
    </div>

</main>



<script>

const search = document.getElementById('collectionSearch');

const cards = [
    ...document.querySelectorAll('.collection-card')
];

const empty = document.getElementById('collectionEmpty');


search.addEventListener('input', () => {

    const q = search.value
        .trim()
        .toLowerCase();

    let visible = 0;


    cards.forEach(card => {

        const match =
            card.dataset.name.includes(q);

        card.hidden = !match;

        if (match) {
            visible++;
        }

    });


    empty.style.display =
        visible ? 'none' : 'block';

});

</script>
