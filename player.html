const params = new URLSearchParams(window.location.search);
let id = params.get("id") || "soy";
let show = data[id] || data["soy"];

const player = document.getElementById("mainPlayer");

let currentSeason = "";
let currentEpisode = 0;
let server = 1;

function getUrl(ep){
    if(server === 1) return ep.s1;
    return `https://archive.org/embed/${ep.s2}`;
}

function loadEpisode(season,index){

    const ep = show[season][index];

    if(!ep || ep.unavailable) return;

    currentSeason = season;
    currentEpisode = index;

    player.src = getUrl(ep);

    updateActive();
}

function generate(){

    const container =
    document.getElementById("seasonsContainer");

    container.innerHTML = "";

    Object.keys(show).forEach(season=>{

        const title =
        document.createElement("div");

        title.className = "season-title";
        title.textContent =
        season.replace("sezon","Sezon ");

        container.appendChild(title);

        const grid =
        document.createElement("div");

        grid.className = "episodes-grid";

        show[season].forEach((ep,index)=>{

            const card =
            document.createElement("div");

            card.className =
            "episode-card";

            if(ep.unavailable){

                card.classList.add("disabled");

                card.innerHTML =
                `EP ${index+1}<small>În curând</small>`;

            }else{

                card.textContent =
                `EP ${index+1}`;

                card.onclick = ()=>{
                    loadEpisode(season,index);
                };
            }

            grid.appendChild(card);
        });

        container.appendChild(grid);
    });
}

function updateActive(){

    document
    .querySelectorAll(".episode-card")
    .forEach(card=>card.classList.remove("active"));

    let counter = 0;

    Object.keys(show).forEach(season=>{

        show[season].forEach((ep,index)=>{

            if(
                season === currentSeason &&
                index === currentEpisode
            ){
                document
                .querySelectorAll(".episode-card")[counter]
                .classList.add("active");
            }

            counter++;
        });
    });
}

generate();
loadEpisode("sezon1",0);
