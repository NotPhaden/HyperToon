const params=new URLSearchParams(location.search);
const id=params.get("id")||"soy";
const show=data[id]||data.soy;
document.title="HYPERTOON — "+show.title;
document.getElementById("showTitle").textContent=show.title;
const player=document.getElementById("mainPlayer");
let currentSeason="",currentEpisode=-1;

function loadEpisode(season,index){
    const ep=show[season][index];
    if(!ep||ep.unavailable||!ep.s1)return;
    currentSeason=season;currentEpisode=index;player.src=ep.s1;updateActive();
}
function generate(){
    const container=document.getElementById("seasonsContainer");
    Object.keys(show).filter(k=>k!=="title").forEach(season=>{
        const title=document.createElement("div");
        title.className="season-title";
        title.textContent=season.replace("sezon","Sezon ");
        container.appendChild(title);
        const grid=document.createElement("div");grid.className="episodes-grid";
        show[season].forEach((ep,index)=>{
            const card=document.createElement("button");
            card.className="episode-card";
            card.type="button";
            if(ep.unavailable||!ep.s1){card.classList.add("disabled");card.innerHTML=`EP ${index+1}<small>În curând</small>`}
            else{card.textContent=`EP ${index+1}`;card.onclick=()=>loadEpisode(season,index)}
            grid.appendChild(card);
        });
        container.appendChild(grid);
    });
}
function updateActive(){
    document.querySelectorAll(".episode-card").forEach(c=>c.classList.remove("active"));
    let i=0;
    Object.keys(show).filter(k=>k!=="title").forEach(season=>{
        show[season].forEach((_,index)=>{
            if(season===currentSeason&&index===currentEpisode)
                document.querySelectorAll(".episode-card")[i]?.classList.add("active");
            i++;
        });
    });
}
generate();
const first=Object.keys(show).find(k=>k!=="title"&&show[k].some(e=>e.s1&&!e.unavailable));
if(first) loadEpisode(first,show[first].findIndex(e=>e.s1&&!e.unavailable));
