<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="logo.png">

    <title>HYPERTOON — Episoade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* BUTON ÎNAPOI */

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: .2s;
        }

        .back-button:hover {
            background: #333;
        }

        /* PLAYER */

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            display: none;
            margin-bottom: 35px;
        }

        .video-wrapper.visible {
            display: block;
        }

        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 14px;
            background: #000;
        }

        /* MESAJ */

        .select-message {
            margin: 20px 0 35px;
            padding: 18px 20px;
            background: #181818;
            border-radius: 12px;
            color: #bbb;
            text-align: center;
            border: 1px solid #292929;
        }

        .select-message.hidden {
            display: none;
        }

        /* SEZOANE */

        .season-title {
            font-size: 32px;
            font-weight: bold;
            margin: 40px 0 15px;
        }

        /* EPISOADE */

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(120px, 1fr)
            );
            gap: 12px;
        }

        .episode-card {
            padding: 16px;
            background: #222;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition:
                transform .2s,
                background .2s,
                box-shadow .2s;
        }

        .episode-card:hover {
            transform: translateY(-3px);
            background: #2d2d2d;
        }

        .episode-card.active {
            background: #e50914;
            box-shadow: 0 0 18px rgba(229, 9, 20, .35);
        }

        .disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .disabled:hover {
            transform: none;
            background: #222;
        }

        .disabled small {
            display: block;
            margin-top: 5px;
            color: orange;
        }

        /* PLAYER MODE */

        body.player-mode {
            padding-top: 20px;
        }

        body.player-mode .back-button {
            margin-bottom: 15px;
        }

        /* MOBIL */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .season-title {
                font-size: 25px;
                margin-top: 30px;
            }

            .episodes-grid {
                grid-template-columns:
                    repeat(auto-fill, minmax(90px, 1fr));
                gap: 9px;
            }

            .episode-card {
                padding: 13px 8px;
                font-size: 14px;
            }

            .video-wrapper iframe {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

<button
    id="backButton"

/* =========================================================
   PARAMETRI
========================================================= */

const params = new URLSearchParams(
    window.location.search
);

const id = params.get("id") || "soy";

const show = data[id] || data.soy;


/* =========================================================
   ELEMENTE
========================================================= */

const player =
    document.getElementById("mainPlayer");

const videoWrapper =
    document.getElementById("videoWrapper");

const selectMessage =
    document.getElementById("selectMessage");

const seasonsContainer =
    document.getElementById("seasonsContainer");

const backButton =
    document.getElementById("backButton");


/* =========================================================
   STARE
========================================================= */

let currentSeason = "";
let currentEpisode = -1;

let server = 1;


/* =========================================================
   URL PLAYER
========================================================= */

function getUrl(ep) {

    if (!ep) {
        return "";
    }

    /*
       SERVER 1 = Rumble / OK.ru etc.
    */

    if (server === 1) {

        if (
            !ep.s1 ||
            ep.s1.startsWith("nr episod ")
        ) {
            return "";
        }

        return ep.s1;
    }


    /*
       SERVER 2 = Archive.org
    */

    if (
        !ep.s2 ||
        ep.s2.startsWith("nr episod ")
    ) {
        return "";
    }

    return "https://archive.org/embed/" + ep.s2;
}


/* =========================================================
   ÎNCARCĂ EPISOD
========================================================= */

function loadEpisode(season, index) {

    const ep = show[season][index];

    if (!ep) {
        return;
    }

    /*
       Dacă este indisponibil
    */

    if (ep.unavailable) {
        return;
    }

    /*
       Verificăm dacă avem URL real
    */

    const url = getUrl(ep);

    if (!url) {

        alert(
            "Episodul nu este disponibil momentan."
        );

        return;
    }


    /*
       Salvăm episodul curent
    */

    currentSeason = season;
    currentEpisode = index;


    /*
       Arătăm playerul
    */

    videoWrapper.classList.add("visible");


    /*
       Ascundem mesajul
    */

    selectMessage.classList.add("hidden");


    /*
       FOARTE IMPORTANT:
       ascundem COMPLET lista episoadelor
    */

    seasonsContainer.style.display = "none";


    /*
       Mod player
    */

    document.body.classList.add("player-mode");


    /*
       Punem URL-ul în iframe
    */

    player.src = url;


    /*
       Actualizăm episodul activ
    */

    updateActive();


    /*
       Scroll la player
    */

    setTimeout(() => {

        videoWrapper.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 100);
}


/* =========================================================
   ÎNAPOI
========================================================= */

function goBack() {

    /*
       Dacă playerul este deschis,
       revenim la lista episoadelor.
    */

    if (
        videoWrapper.classList.contains("visible")
    ) {

        /*
           Oprim playerul
        */

        player.src = "";


        /*
           Ascundem playerul
        */

        videoWrapper.classList.remove(
            "visible"
        );


        /*
           Arătăm lista episoadelor
        */

        seasonsContainer.style.display = "";


        /*
           Arătăm mesajul
        */

        selectMessage.classList.remove(
            "hidden"
        );


        /*
           Ieșim din player mode
        */

        document.body.classList.remove(
            "player-mode"
        );


        /*
           Resetăm episodul
        */

        currentSeason = "";
        currentEpisode = -1;


        /*
           Scoatem active
        */

        updateActive();


        /*
           Revenim sus
        */

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        return;
    }


    /*
       Dacă nu este playerul deschis,
       revenim la index.
    */

    window.location.href =
        "index.html";
}


/* =========================================================
   GENERARE EPISOADE
========================================================= */

function generate() {

    seasonsContainer.innerHTML = "";


    Object.keys(show).forEach(season => {

        /*
           TITLU SEZON
        */

        const title =
            document.createElement("div");

        title.className =
            "season-title";

        title.textContent =
            season.replace(
                "sezon",
                "Sezon "
            );

        seasonsContainer.appendChild(
            title
        );


        /*
           GRID
        */

        const grid =
            document.createElement("div");

        grid.className =
            "episodes-grid";


        /*
           EPISOADE
        */

        show[season].forEach(
            (ep, index) => {

                const card =
                    document.createElement("div");

                card.className =
                    "episode-card";


                /*
                   EPISOD INDISPONIBIL
                */

                if (
                    ep.unavailable ||
                    (
                        ep.s1 &&
                        ep.s1.startsWith(
                            "nr episod "
                        )
                    )
                ) {

                    card.classList.add(
                        "disabled"
                    );

                    card.innerHTML = `
                        EP ${index + 1}
                        <small>În curând</small>
                    `;
                }


                /*
                   EPISOD DISPONIBIL
                */

                else {

                    card.textContent =
                        `EP ${index + 1}`;

                    card.onclick = () => {

                        loadEpisode(
                            season,
                            index
                        );

                    };
                }


                grid.appendChild(card);

            }
        );


        seasonsContainer.appendChild(
            grid
        );

    });
}


/* =========================================================
   EPISOD ACTIV
========================================================= */

function updateActive() {

    document
        .querySelectorAll(
            ".episode-card"
        )
        .forEach(card => {

            card.classList.remove(
                "active"
            );

        });


    if (currentEpisode < 0) {
        return;
    }


    let counter = 0;


    Object.keys(show).forEach(
        season => {

            show[season].forEach(
                (ep, index) => {

                    if (
                        season === currentSeason &&
                        index === currentEpisode
                    ) {

                        const cards =
                            document.querySelectorAll(
                                ".episode-card"
                            );

                        if (cards[counter]) {

                            cards[counter]
                                .classList
                                .add("active");

                        }
                    }

                    counter++;

                }
            );

        }
    );
}


/* =========================================================
   START
========================================================= */

generate();
